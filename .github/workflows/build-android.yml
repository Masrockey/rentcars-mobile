name: Build Android APK

on:
    workflow_dispatch: # Memungkinkan tombol "Run workflow" manual dari GitHub UI
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Setup Java (JDK 17)
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install NDK & CMake
              run: |
                  yes | sdkmanager --licenses
                  sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

            - name: Install Dependencies
              run: npm ci

            - name: Create local.properties
              run: |
                  echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
                  echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> android/local.properties

            - name: Build Android APK
              env:
                  EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
              run: |
                  cd android
                  chmod +x gradlew
                  ./gradlew assembleRelease

            - name: Upload APK Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: app-release-apk
                  path: android/app/build/outputs/apk/release/*.apk
